name: Upstream Sync
on:
  schedule:
    # 08:27 Asia/Manila / Beijing. GitHub may delay scheduled jobs.
    - cron: '27 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: upstream-sync-main
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'nextwa/Telegraph-Image'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream application changes while preserving deployment workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/cf-pages/Telegraph-Image.git
          git fetch upstream main
          latest=$(git rev-parse upstream/main)
          if [ -f .upstream-revision ]; then
            base=$(cat .upstream-revision)
          else
            base=$(git merge-base HEAD upstream/main)
          fi
          git cat-file -e "${base}^{commit}"
          git diff --binary "$base" "$latest" -- . ':(exclude).github/**' ':(exclude).upstream-revision' ':(exclude)DEPLOYMENT.md' ':(exclude)AGENTS.md' > "$RUNNER_TEMP/upstream.patch"
          if [ -s "$RUNNER_TEMP/upstream.patch" ]; then
            git apply --3way --index "$RUNNER_TEMP/upstream.patch"
          fi
          printf '%s\n' "$latest" > .upstream-revision
          git add .upstream-revision
          if git diff --cached --quiet; then
            echo 'Already current; no deployment required.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore: sync cf-pages/Telegraph-Image@${latest:0:8}"
          git push origin HEAD:main
          echo 'Upstream application changes pushed. Cloudflare Pages Git integration will build and deploy main.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Workflow changes are intentionally retained locally and require review. Application merge conflicts stop this job without changing production.' >> "$GITHUB_STEP_SUMMARY"
